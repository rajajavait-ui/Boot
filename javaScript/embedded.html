<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function printer() {
            window.print();
        }
    </script>
</head>
<body>
    <h1>Embedded Script</h1>
    <button onclick="printer()">Print Page</button>
</body>
</html>

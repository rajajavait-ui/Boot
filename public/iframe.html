<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frames</title>
    <style>
        body
        {
            display: grid;
            grid-template-columns: 3fr 9fr;
        }
        iframe
        {
            border: none;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="./images/Java.png" target="preview">Java</a></li>
            <li><a href="https://www.youtube.com/embed/si-KFFOW2gw" target="preview">C language</a></li>
        </ul>
    </nav>
    <section>
        <iframe name="preview" width="100%" height="600"></iframe>
    </section>
</body>
</html>

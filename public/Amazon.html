<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZON</title>
    <style>
        section
        {
            display: grid;
            grid-template-columns: 3fr 3fr 3fr 3fr;
            margin-top: -200px;
           
        }
        .card
        {
           background-color: white;
           margin: 5px;
           height: 400px;
           box-shadow: 2px 2px 10px gray;
           padding: 5px;
           font-family: Arial;
        }
        .card-img
        {
            width: 100%;
        }
        .row
        {
            display: grid;
            grid-template-columns: 6fr 6fr;
            grid-gap: 5px ;
        }
        .card-header
        {
            height: 65px;
        }
        .card-title
        {
            font-size: 18px;
            font-weight: bold;
        }
        .card-img+div
        {
            text-align: center;
            margin-top: 2px;
            font-size: 14px;
        }
        .card-footer
        {
            padding: 10px;
            text-align: left;
            color: blue;
        }
        .card-body
        {
            height: 300px;
        }
        .card-last
        {
           background-color: white;
           margin: 5px;
           height: 200px;
           box-shadow: 2px 2px 10px gray;
           padding: 5px;
           font-family: Arial;
           margin: 10px;
        }
        .card-last-head
        {
            display: grid;
            grid-template-columns: 6fr 6fr;
        }
        .card-last-title
        {
            font-size: 20px;
            font-weight: bold;
            margin-top: 50px;
            text-align: left;
        }
    </style>
</head>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
  </head>
  <body class="container-fluid">
    <div class="carousel" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
    </div>
    <h1>Slide Attribute is Used the Below carousel</h1>
    <div class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
    </div>
    <h1>Fade Attribute is Used the Below carousel</h1>
    <div class="carousel carousel-fade" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
    </div>
    <h1>Controls is Used the Below carousel</h1>
    <div class="carousel slide" data-bs-ride="carousel" id="banners">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
      <button
        data-bs-slide="prev"
        data-bs-target="#banners"
        class="carousel-control-prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        data-bs-slide="next"
        data-bs-target="#banners"
        class="carousel-control-next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
    <h1>pages is Used the Below carousel</h1>
    <div class="carousel slide" data-bs-ride="carousel" id="banners-1">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
      <button
        data-bs-slide="prev"
        data-bs-target="#banners"
        class="carousel-control-prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        data-bs-slide="next"
        data-bs-target="#banners"
        class="carousel-control-next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
      <div class="carousel-indicators">
        <button
          class="active"
          data-bs-slide-to="0"
          data-bs-target="#banners-1"
        ></button>
        <button data-bs-slide-to="0" data-bs-target="#banners-1"></button>
        <button data-bs-slide-to="1" data-bs-target="#banners-1"></button>
        <button data-bs-slide-to="2" data-bs-target="#banners-1"></button>
        <button data-bs-slide-to="3" data-bs-target="#banners-1"></button>
      </div>
    </div>
    <h1>Time is Used the Below carousel for Every One second</h1>
    <div class="carousel slide" data-bs-ride="carousel" id="banners-2" data-bs-interval="1000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../public/images/slide-1.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-2.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-3.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-4.jpg" class="w-100" height="250" />
        </div>
        <div class="carousel-item">
          <img src="../public/images/slide-5.jpg" class="w-100" height="250" />
        </div>
      </div>
      <button
        data-bs-slide="prev"
        data-bs-target="#banners"
        class="carousel-control-prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        data-bs-slide="next"
        data-bs-target="#banners"
        class="carousel-control-next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
      <div class="carousel-indicators">
        <button
          class="active"
          data-bs-slide-to="0"
          data-bs-target="#banners-2"
        ></button>
        <button data-bs-slide-to="0" data-bs-target="#banners-2"></button>
        <button data-bs-slide-to="1" data-bs-target="#banners-2"></button>
        <button data-bs-slide-to="2" data-bs-target="#banners-2"></button>
        <button data-bs-slide-to="3" data-bs-target="#banners-2"></button>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>
<body class="container-fluid">
    <h1>Alerts</h1>
    <div class="alert alert-danger alert-dismissible" style="width: 500px;">
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
        <h2 class="alert-title">Delete Employee</h2>
        <p class="alert-subtitle">Employee Deleted Successfully</p>
        <a href="#" class="alert-link">Help ?</a>
    </div>
    <div class="alert alert-success alert-dismissible" style="width: 500px;">
        <h2>Create Employee</h2>
        <p>Employee Created Successfully</p>
        <a href="#">Help ?</a><br><br>
        <button class="btn btn-success" data-bs-dismiss="alert">Ok</button>
    </div>
    <aside class="alert alert-light alert-dismissible" style="width:500px;">
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
        <h1>ADS</h1>
        <img src="../public/images/LittleGirl.jpg" alt="ads" style="width: 300px; height: 300px;">
    </aside>

</html>

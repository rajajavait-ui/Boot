<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function deleteFunction() {
         click=confirm("click Correct One");
        if (click == true) {
          document.querySelector("p").outerHTML=" <i><b>Canceled</b></i>";
        } else {
           document.write("You Choose a wrong One")
        }
      }
    </script>
  </head>
  <body>
    <h1>outerHTML is  Replace the element</h1>
    <button onclick="deleteFunction()">Button</button>
    <p></p>
  </body>
</html>

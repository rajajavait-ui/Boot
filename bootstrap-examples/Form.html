<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>

<body>
    <div class="p-4 d-flex justify-content-center">
        <form class="border border-2 border-secondary rounded rounded-2 mt-2 p-4 w-25">
            <h3 class="bi bi-person-circle">Register User</h3>
            <div class="mb-2">
                <label class="form-label">First Name</label>
                <div>
                    <input type="text" class="form-control">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Last Name</label>
                <div>
                    <input type="text" class="form-control">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">City</label>
                <div>
                    <select class="form-select">
                        <option value="">Select City</option>
                    </select>
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Rating</label>
                <div>
                    <input type="range" class="form-range">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Gender</label>
                <div>
                    <input class="form-check-input" type="radio" name="Male"><label
                        class="form-check-label">Male</label>
                    <input class="form-check-input" type="radio" name="FeMale"><label
                        class="form-check-label">FeMale</label>
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label">Subscribe</label>
                <!-- <div class="form-switch"> -->
                <div>
                    <input type="checkbox" class="form-check-input"><label class="form-check-label">Yes</label>
                </div>
            </div>
            <div class="mb-2">
                <button class="btn btn-warning w-100">Register</button>
                <button class="btn btn-link w-100">Forget Passoword ?</button>
            </div>
        </form>
    </div>
</body>

</html>

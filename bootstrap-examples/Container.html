<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
  </head>
  <body class="container-fluid">
    <div class="p-3 border border-2 border-danger">
      <div class="progress">
        <div
          class="progress-bar progress-bar-animated progress-bar-striped"
          style="width: 40%"
        >
          40%completed
        </div>
        <div class="progress-bar bg-dark" style="width: 60%">60%completed</div>
      </div>
      <br class="p-3" />
      <div class="spinner-border"></div>
      <br class="p-5" />
      <button class="btn btn-primary">
        <span class="spinner-border spinner-border-sm"></span> Loading
      </button>
      <br class="mt-4 p-4" />
      <div class="spinner-grow mt-4 p-4"></div>
      <br class="p-5" />
      <div class="spinner-grow mt-3 bg-primary">20%</div>
    </div>
  </body>
</html>

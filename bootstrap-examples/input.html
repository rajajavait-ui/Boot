<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</head>

<body class="p-4">
    <form class="input-group">
        <select class="input-group-text">
            <option value="">All</option>
        </select>
        <input type="text" class="form-control" placeholder="Serach mobiles...">
        <button class="bi-search btn btn-warning"></button>
    </form>
    <h3>Register</h3>
    <form class="w-50">
        <div  class="input-group">
            <span class="bi bi-person-circle input-group-text"></span>
            <input type="text" class="form-control" placeholder="User Name">
            <span class="input-group-text"><input type="checkbox"></span>
        </div>
        <div class="input-group mt-3">
            <span class="bi bi-key-fill input-group-text"></span>
            <input type="password" class="form-control" placeholder="pasword">
            <span class="input-group-text"><input type="checkbox"></span>
        </div>
        <div class="input-group mt-3">
            <span class="bi bi-currency-rupee input-group-text"></span>
            <input type="number" placeholder="Enter Amount" class="form-control">
            <span class="input-group-text">00.0</span>
        </div>
    </form>
</body>

</html>
